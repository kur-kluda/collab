<script type="text/javascript">
function but_hider(frameselector, butselector){
$(frameselector).on("load", () =>{let hadbut=  window.setInterval(
    ()=>{if($(butselector, $(frameselector)[0].contentDocument).length <1) {}
	else {$(butselector, $(frameselector)[0].contentDocument).remove(); window.clearInterval(hadbut);}
	}, 500);});
}
$(document).ready(()=>{
//'.navbar-page-btn' -> .parent().remove()
but_hider('#fr_gr1', '.navbar-edit');
but_hider('#fr_gr1', '.navbar-page-btn');
but_hider('#fr_gr2', '.navbar-edit');
but_hider('#fr_gr2', '.navbar-page-btn');

});</script>
