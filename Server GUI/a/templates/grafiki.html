<script type="text/javascript">
function but_hider(frameselector, butselector, wanaBeTitle){
$(frameselector).on("load", () =>{let hadbut=  window.setInterval(
    ()=>{if($(butselector, $(frameselector)[0].contentDocument).length <1) {}
	else {
	if($(frameselector+"_header1", $(frameselector)[0].contentDocument).length <1) {
	//oh no bad this is so bad.. but well no way to write oneliner that includes id class tagname ++
	if(wanaBeTitle!='')
	$("<h1 id='"+frameselector+"_header1"+"'>"+wanaBeTitle+"</h1>").insertBefore($(butselector, $(frameselector)[0].contentDocument));
	}
	$(butselector, $(frameselector)[0].contentDocument).remove(); window.clearInterval(hadbut);
	}
	}, 500);});
}
$(document).ready(()=>{
//'.navbar-page-btn' -> .parent().remove()
but_hider('#fr_gr1', '[aria-label="Breadcrumbs"]', 'Temperatūras mērījumi');
//tas pats te.
but_hider('#fr_gr1', '#mega-menu-toggle', '');
//papildus search bar poga līdz ar atjauninājumu...
but_hider('#fr_gr1', '[title="Toggle top search bar"]', '');

but_hider('#fr_gr2', '[aria-label="Breadcrumbs"]', 'Relat. mitruma mērījumi');
//pamanās paralēli 2 izpildīt..
but_hider('#fr_gr2', '#mega-menu-toggle', '');
but_hider('#fr_gr2', '[title="Toggle top search bar"]', '');

but_hider('#fr_gr3', '[aria-label="Breadcrumbs"]', 'Gāzu mērījumi');
//pamanās paralēli 2 izpildīt..
but_hider('#fr_gr3', '#mega-menu-toggle', '');
but_hider('#fr_gr3', '[title="Toggle top search bar"]', '');
});</script>
