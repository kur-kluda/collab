<script type="text/javascript">
function but_hider(frameselector, butselector, wanaBeTitle){
$(frameselector).on("load", () =>{let hadbut=  window.setInterval(
    ()=>{if($(butselector, $(frameselector)[0].contentDocument).length <1) {}
	else {$(butselector, $(frameselector)[0].contentDocument).remove(); window.clearInterval(hadbut);
	if($(frameselector+"_header1", $(frameselector)[0].contentDocument).length <1) {
	//oh no bad this is so bad.. but well no way to write oneliner that includes id class tagname ++
	if(wanaBeTitle!='')
	$("<h1 id='"+frameselector+"_header1"+"'>"+wanaBeTitle+"</h1>").insertBefore($(".navbar__spacer", $(frameselector)[0].contentDocument));
	}
	}
	}, 500);});
}
