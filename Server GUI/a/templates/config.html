{% load metadata %}
<!DOCTYPE html>
<html>
    <head>
        {% load static %} 

<link rel="apple-touch-icon" sizes="180x180" href="{% static '/favicon/apple-touch-icon.png' %}">
<link rel="icon" type="image/png" sizes="32x32" href="{% static '/favicon/favicon-32x32.png' %}">
<link rel="icon" type="image/png" sizes="16x16" href="{% static '/favicon/favicon-16x16.png' %}">
<link rel="manifest" href="{% static '/favicon/site.webmanifest' %}">
<link rel="mask-icon" href="{% static '/favicon/safari-pinned-tab.svg' %}" color="#5bbad5">
<meta name="msapplication-TileColor" content="#da532c">
<meta name="theme-color" content="#ffffff">

    </head>
<body>
    <form method="post" action="{% url 'configApp' %}">
    {% csrf_token %}
{% for i in range %}
{# still no range (1,2) in django up today #}
<h4>Controller {{i}}</h4>
<p>
{{ i|getmeta }}
</p>
<input 
    class="custom-range" 
    name="measure_all_interval_slider_{{i}}"
    type="range" value="1" min="1" max="3600"
    id="slii"  oninput="this.nextElementSibling.value = this.value">
<input type="number" name="measure_all_interval_{{i}}" value="1"> seconds
<p></p>
{% endfor %}
<input type="submit" value="update ALL wait times">
</form>
{% if errorText %}
Error: <pre>{{errorText}}</pre>
{% else %}
{% if  request.method == 'POST' %}
updated!
{% endif %}
{% endif %}
</body>
</html>
