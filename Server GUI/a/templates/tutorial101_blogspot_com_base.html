<!DOCTYPE html> 
<html lang="en"> 
<head> 
<meta charset="UTF-8"> 
<title>{% block title %}{% endblock %}</title>
{% load static %} 
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"/>
<link rel = "stylesheet" type = "text/css" href = "https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css"/>
<meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1"/>
</head> 
<body>
<div class="container">
<div class="row">
{% block content %}{% endblock %}
</div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"
			  integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
			  crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

<script src = "https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script>
$(document).ready(function() {
$('#bootstrapdatatable').DataTable({ 
"aLengthMenu": [[3, 5, 10, 25, -1], [3, 5, 10, 25, "All"]],
/*"iDisplayLength": 3*/
} 
);
} );
</script>
<script type="text/javascript">

    $(document).ready(()=>{
        $(".post-form input").addClass("form-control");
        $(".post-form select").addClass("form-control");
        $(".post-form textarea").addClass("form-control");
        $('.post-form input[type="checkbox"]').removeClass("form-control");
    });
</script>
</body> 
</html>
